<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NBTC Digest · Episode 1</title>
<link rel="stylesheet" href="lib/fonts.css">
<style>
  /* Dark, Turion-inspired look. Colour roles: lavender = cables, lime = the opportunity (used nowhere else). */
  :root {
    --bg: #0b0b10;
    --ink: #f1f0f7;
    --muted: #a3a1b5;
    --faint: #85839a;
    --line: #23222e;
    --card: #14131c;
    --cable: #a99cf0;
    --cable-glow: rgba(169, 156, 240, .55);
    --accent: #d4f36b;
    --accent-glow: rgba(212, 243, 107, .5);
    --sea: #04050c;
    --land: #15141d;
    --land-th: #1d1b29;
    --land-stroke: #2c2a3c;
    --halo: #0b0b10;
    --mono: "JetBrains Mono", "IBM Plex Sans Thai", ui-monospace, monospace;
    --display: "Funnel Display", "IBM Plex Sans Thai", sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-family: "IBM Plex Sans", "IBM Plex Sans Thai", sans-serif; color: var(--ink); background: var(--bg); }
  /* Thai looks smaller and needs room for marks above and below the line */
  html:lang(th) { font-family: "IBM Plex Sans Thai", "IBM Plex Sans", sans-serif; font-size: 110%; }
  body { margin: 0; font-size: 1rem; line-height: 1.7; counter-reset: sec; }
  html:lang(th) body { line-height: 1.85; }
  h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.15; margin: 0 0 .6em; letter-spacing: -.01em; }
  html:lang(th) h1, html:lang(th) h2, html:lang(th) h3 { font-family: "IBM Plex Sans Thai", sans-serif; font-weight: 600; line-height: 1.45; letter-spacing: 0; }
  p { margin: 0 0 1em; color: var(--muted); }
  a { color: var(--cable); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Small typewriter-style labels with a square marker, numbered per section */
  .label, .step h2::before, .wide > h2::before {
    font-family: var(--mono); font-size: .72rem; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--cable);
  }
  .step h2, .wide > h2 { counter-increment: sec; }
  .step h2::before, .wide > h2::before { content: "■ " counter(sec, decimal-leading-zero); display: block; margin-bottom: 1.1em; line-height: 1; }

  .lang-switch { position: fixed; top: 16px; right: 16px; z-index: 10; font-family: var(--mono); font-size: .78rem; letter-spacing: .08em;
    min-height: 44px; padding: 0 18px; border: 1px solid var(--line); border-radius: 0; background: rgba(11, 11, 16, .8); color: var(--ink); cursor: pointer; }
  .lang-switch:hover { border-color: var(--cable); }

  /* Opening screen: the title over the night map (northern Thailand) */
  .cover { position: relative; }
  .step.cover { padding: 12vh 0 14vh; }
  .cover > * { max-width: 640px; text-shadow: 0 2px 18px rgba(0, 0, 0, .8); }
  .kicker { margin-bottom: 2em; }
  .cover h1 { font-size: clamp(2.2rem, 4.6vw, 3.8rem); }
  html:lang(th) .cover h1 { font-size: clamp(2rem, 4vw, 3.2rem); }
  .cover .subtitle { font-size: 1.15rem; color: var(--ink); opacity: .85; }
  .cover .date { margin-top: 2em; }
  .scroll-cue { position: absolute; bottom: 5vh; left: 0; color: var(--muted); font-size: 1rem; }

  /* Story: a full-screen night map stays put; text boxes scroll over it */
  .story { position: relative; display: flex; flex-direction: column; }
  .map-panel { order: -1; position: sticky; top: 0; height: 100vh; z-index: 0; background: var(--sea); }
  .map-box { position: relative; width: 100%; height: 100%; }
  /* The map layer is larger than the screen and tilted back, so its far edge never shows; keep in step with TILT in the script */
  .map-box { overflow: hidden; }
  #mapsvg { position: absolute; left: -25%; top: -35%; width: 150%; height: 160%; display: block;
    transform: perspective(1400px) rotateX(24deg); transform-origin: 50% 60%; }
  #pinsvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; pointer-events: none; }
  .steps { position: relative; z-index: 1; margin-top: -100vh; padding: 0 max(16px, 4vw) 40vh; max-width: 600px; pointer-events: none; }
  .step { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 10vh 0; }
  .step .box { pointer-events: auto; background: rgba(11, 11, 16, .8); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line); padding: 30px 32px 22px; }
  .step h2 { font-size: clamp(1.5rem, 2.4vw, 2.1rem); }
  .step .note { font-size: .85rem; color: var(--faint); }
  .more-toggle { display: none; }

  /* Reading progress through the map story: a slim line along the top of the screen */
  .progress-line { position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 6; background: rgba(169, 156, 240, .12); transition: opacity .4s; pointer-events: none; }
  .progress-line span { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--cable); box-shadow: 0 0 8px var(--cable-glow); }
  .progress-line.away { opacity: 0; }

  .map-box .spotlight { fill: rgba(3, 3, 8, .8); }
  .map-box .border { fill: none; stroke: rgba(200, 195, 235, .22); stroke-width: .7; }
  .map-box .border.th { stroke: #ece8ff; stroke-width: 1.3; }
  .map-box .border.th.glow { stroke: rgba(169, 156, 240, .35); stroke-width: 7; }
  .map-box .cable { fill: none; stroke: var(--cable); stroke-width: 1.3; }
  .map-box .cable.glow { stroke: var(--cable-glow); stroke-width: 6; opacity: .45; stroke-dasharray: none; }
  .map-box .planned { stroke-dasharray: 5 4; }
  .map-box .domestic { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .map-box .domestic.glow { stroke: var(--accent-glow); stroke-width: 12; opacity: .5; stroke-dasharray: none; }
  .map-box .landing { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
  .map-box .dc { color: #fff; filter: drop-shadow(0 0 3px rgba(0, 0, 0, .9)); }
  .map-box .dc.foreign { color: var(--muted); }
  .map-box text { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
  html:lang(en) .map-box text { text-transform: uppercase; }
  html:lang(th) .map-box text { font-size: 12.5px; letter-spacing: 0; }
  .map-box text.sea-name { fill: #6d6a88; stroke: none; }
  .map-box text.country { fill: #8c89a8; stroke: none; font-size: 11px; letter-spacing: .3em; }
  html:lang(th) .map-box text.country { letter-spacing: .05em; font-size: 13px; }
  .map-box text.cable-name { fill: var(--cable); font-size: 10px; }
  .map-box text.hl { fill: var(--accent); }
  .map-meta { position: absolute; right: 14px; bottom: 10px; max-width: 46%; text-align: right; font-family: var(--mono); font-size: .62rem;
    letter-spacing: .04em; line-height: 1.5; color: var(--faint); }
  html:lang(th) .map-meta { font-family: "IBM Plex Sans Thai", sans-serif; font-size: .72rem; letter-spacing: 0; }
  .map-meta a { color: var(--muted); }
  .legend { position: absolute; right: 14px; bottom: 58px; z-index: 2; justify-content: flex-end; display: flex; flex-wrap: wrap; gap: 8px 20px; max-width: 560px;
    padding: 10px 14px; background: rgba(11, 11, 16, .75); border: 1px solid var(--line);
    font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  html:lang(th) .legend { font-size: .76rem; letter-spacing: 0; }
  .legend > span { display: inline-flex; align-items: center; gap: 8px; }
  .legend svg { flex: none; }
  .key-dc { color: #fff; }
  .key-landing { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
  .key-cable { stroke: var(--cable); stroke-width: 1.3; }
  .key-planned { stroke: var(--cable); stroke-width: 1.3; stroke-dasharray: 5 4; }
  .key-domestic { stroke: var(--accent); stroke-width: 3; }

  .cable-list { list-style: none; padding: 0; margin: 0 0 1em; }
  .cable-list li { padding: .7em 0; border-top: 1px solid var(--line); font-size: .92rem; color: var(--muted); }
  .cable-list li::before { content: "■"; color: var(--cable); font-size: .6em; margin-right: 1em; vertical-align: .2em; }

  .bars { display: flex; align-items: flex-end; gap: 36px; margin: 1.6em 0 1.8em; }
  .bar { display: flex; flex-direction: column; align-items: flex-start; width: 140px; }
  .bar b { font-family: var(--display); font-size: 1.9rem; font-weight: 500; margin-bottom: 8px; white-space: nowrap; }
  .bar span { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 10px; line-height: 1.4; }
  html:lang(th) .bar span { font-size: .78rem; letter-spacing: 0; }
  .bar .fill { width: 72px; height: calc(190px * var(--h, 1)); background: #3a3650;
    transform: scaleY(0); transform-origin: bottom; transition: transform 1.1s cubic-bezier(.2, .7, .2, 1); }
  .bar .fill.big { background: var(--cable); box-shadow: 0 0 24px var(--cable-glow); transition-delay: .25s; }
  .seen .bar .fill { transform: none; }

  .split { display: flex; align-items: flex-start; margin: 1.6em 0 2em; }
  .split .seg { flex: 1; padding-top: 12px; font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.5; }
  html:lang(th) .split .seg { font-size: .8rem; letter-spacing: 0; }
  .split .sea { border-top: 1px solid var(--cable); color: var(--cable); }
  .split .land { border-top: 3px solid var(--accent); color: var(--accent); padding-left: 10px; }
  .split .dot { flex: none; width: 14px; height: 14px; margin-top: -6px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--bg); }

  .roles { display: grid; gap: 1px; margin: 0 0 1.4em; background: var(--line); border: 1px solid var(--line); }
  .roles p { margin: 0; padding: 16px 18px; background: var(--bg); font-size: .92rem; color: var(--ink); }

  .wide { max-width: 1180px; margin: 0 auto; padding: 16vh max(16px, 4vw); }
  .wide > h2 { font-size: clamp(1.8rem, 3.4vw, 3rem); max-width: 760px; margin-bottom: 1.2em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); overflow: hidden;
    transition: transform .35s cubic-bezier(.2, .7, .2, 1), border-color .35s, box-shadow .35s; }
  .card:hover { transform: translateY(-6px); border-color: var(--cable); box-shadow: 0 18px 40px -20px var(--cable-glow); }
  .card-body { padding: 22px 24px 26px; }
  /* Photos are darkened and given a faint lavender tone so the three sources look like one set */
  .photo { position: relative; margin: 0; }
  .photo img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; filter: grayscale(.35) brightness(.62) contrast(1.08); }
  .photo::after { content: ""; position: absolute; inset: 0; bottom: auto; aspect-ratio: 16 / 10; pointer-events: none;
    background: linear-gradient(180deg, rgba(169, 156, 240, .18), rgba(11, 11, 16, .55)); mix-blend-mode: multiply; }
  .photo figcaption { display: flex; flex-direction: column; gap: 2px; padding: 8px 24px 0; font-size: .7rem; line-height: 1.5; color: var(--faint); }
  .photo figcaption .credit, .photo figcaption .credit a { color: var(--faint); }
  .photo.missing { display: none; }
  .card h3 { font-family: var(--mono); font-size: .72rem; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  html:lang(th) .card h3 { font-family: "IBM Plex Sans Thai", sans-serif; font-size: .85rem; letter-spacing: 0; }
  .card .big { font-family: var(--display); font-size: 3rem; font-weight: 500; line-height: 1.1; color: var(--ink); margin: .35em 0 .45em;
    text-shadow: 0 0 24px var(--cable-glow); }
  .card p:last-child { font-size: .92rem; margin: 0; }

  /* The takeaway: the page's brightest moment, over a close-up of our night map. Bangkok's lights sit to the right of the text:
     the image is 260% of the box width, and 36% / 37% places Bangkok about 80% across and halfway down. */
  .takeaway { position: relative; overflow: hidden; border: 1px solid rgba(212, 243, 107, .35); border-left: 3px solid var(--accent);
    padding: clamp(28px, 5vw, 56px) clamp(24px, 4vw, 56px); padding-right: clamp(24px, 30vw, 420px); margin-bottom: 3em;
    background: linear-gradient(90deg, rgba(11, 11, 16, .94) 35%, rgba(11, 11, 16, .55) 60%, rgba(11, 11, 16, .05) 85%),
      url(images/night-map.jpg) 36% 37% / 260% auto no-repeat;
    box-shadow: 0 0 60px -30px var(--accent-glow); }
  .takeaway p { position: relative; }
  .takeaway p { font-family: var(--display); font-size: clamp(1.25rem, 2.2vw, 1.75rem); line-height: 1.4; color: var(--ink); margin: 0; }
  html:lang(th) .takeaway p { font-family: "IBM Plex Sans Thai", sans-serif; font-size: clamp(1.1rem, 1.9vw, 1.45rem); line-height: 1.75; }
  .wide h3 { font-family: var(--mono); font-size: .72rem; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--cable); }
  .watch { list-style: none; padding: 0; counter-reset: w; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .watch li { counter-increment: w; background: var(--bg); padding: 22px; color: var(--ink); font-size: .95rem; transition: background .3s; }
  .watch li:hover { background: var(--card); }
  .watch-icon { display: block; width: 40px; height: 40px; margin-bottom: 14px; fill: none; stroke: var(--cable); stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--cable-glow)); }
  .watch li::before { content: counter(w, decimal-leading-zero); display: block; font-family: var(--mono); font-size: .72rem; color: var(--accent); margin-bottom: .8em; }
  .next { color: var(--faint); margin-top: 3em; font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; }

  footer { max-width: 1180px; margin: 0 auto; padding: 6vh max(16px, 4vw) 10vh; border-top: 1px solid var(--line); font-size: .8rem; color: var(--faint); }
  footer h3 { font-family: var(--mono); font-size: .72rem; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  footer ul { padding-left: 1.2em; columns: 2 320px; }
  footer li { break-inside: avoid; margin-bottom: .35em; }
  footer a { color: var(--muted); }
  footer p { color: var(--faint); }

  /* Phone: map sits on the top part of the screen, text scrolls below it */
  @media (max-width: 800px) {
    .steps { padding: 0 12px 30vh; max-width: none; }
    .step { justify-content: flex-end; padding: 0 0 6vh; }
    .step .box { padding: 20px 20px 14px; background: rgba(11, 11, 16, .86); }
    .legend { top: 10px; bottom: auto; left: 10px; right: 10px; padding: 6px 10px; gap: 4px 14px; justify-content: flex-start; }
    /* Phones: keep each box short; the details open on request */
    .step .box { padding: 14px 16px 6px; }
    .step .box p, .cable-list li { font-size: .86rem; line-height: 1.6; margin-bottom: .6em; }
    html:lang(th) .step .box p, html:lang(th) .cable-list li { line-height: 1.7; }
    .step h2 { font-size: 1.15rem; margin-bottom: .45em; }
    html:lang(th) .step h2 { line-height: 1.4; }
    .step h2::before { margin-bottom: .6em; }
    .bars { margin: .4em 0 .6em; gap: 20px; }
    .bar { flex-direction: row; align-items: flex-end; gap: 10px; width: auto; }
    .bar .fill { order: -1; height: calc(70px * var(--h, 1)); width: 34px; }
    .bar b { font-size: 1.15rem; margin: 0; }
    .bar span { display: none; }
    .split { margin: .6em 0 .9em; }
    .roles { margin-bottom: .6em; }
    .roles p { padding: 8px 12px; font-size: .8rem; line-height: 1.5; }
    .box:not(.open) .more { display: none; }
    .more-toggle { display: inline-flex; gap: 6px; align-items: center; min-height: 44px; padding: 0; margin-top: -4px; border: 0; background: none;
      color: var(--cable); font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    html:lang(th) .more-toggle { font-family: "IBM Plex Sans Thai", sans-serif; font-size: .85rem; letter-spacing: 0; }
    .more-toggle span:last-child, .box.open .more-toggle span:first-child { display: none; }
    .box.open .more-toggle span:last-child { display: inline; }
    .takeaway { padding-right: 24px; background: linear-gradient(rgba(11, 11, 16, .8), rgba(11, 11, 16, .8)), url(images/night-map.jpg) 54% 37% / 300% auto no-repeat; }
    .map-meta { display: none; }
    .lang-switch { top: auto; bottom: 16px; }
  }

  /* People who ask their device for less motion get no animation */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    .bar .fill { transform: none; }
  }

  /* Printing: switch to a light version, so it prints cleanly and cheaply */
  @media print {
    :root { --bg: #fff; --ink: #111; --muted: #333; --faint: #555; --line: #ccc; --card: #fff;
      --cable: #5a4fb0; --cable-glow: transparent; --accent: #4d7a00; --accent-glow: transparent;
      --sea: #fff; --land: #f2f2f2; --land-th: #fff; --land-stroke: #bbb; --halo: #fff; }
    .lang-switch, .scroll-cue, .progress-line, .more-toggle { display: none; }
    .cover { min-height: 0; padding: 2em 0; }
    .story { display: block; }
    .map-panel { position: static; height: 150mm; break-inside: avoid; }
    #mapsvg { transform: none; }
    .steps { margin-top: 0; max-width: none; }
    .step .box { background: none; border: 0; padding: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .legend { position: static; background: none; }
    .step, .wide { min-height: 0; padding: 1.5em 0; break-inside: avoid; }
    .bar .fill { transform: none; }
    .takeaway { background: none; box-shadow: none; padding-right: 0; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<button class="lang-switch" data-k="ui.toggle" type="button"></button>
<div class="progress-line" aria-hidden="true"><span></span></div>



<main>
  <div class="story">
    <div class="steps">
      <header class="step cover" data-step="cover">
      <div class="kicker label">■ <span data-k="cover.kicker"></span></div>
      <h1 data-k="cover.title"></h1>
      <p class="subtitle" data-k="cover.subtitle"></p>
      <p class="date label" data-k="cover.date"></p>
      <p class="author label" data-k="cover.author"></p>
      <div class="scroll-cue label" aria-hidden="true">↓</div>
    </header>
      <section class="step" data-step="hook"><div class="box">
        <h2 data-k="hook.headline"></h2>
        <div class="bars" aria-hidden="true">
          <div class="bar"><b data-k="hook.bar1.value"></b><div class="fill" id="bar1"></div><span data-k="hook.bar1.label"></span></div>
          <div class="bar"><b data-k="hook.bar2.value"></b><div class="fill big"></div><span data-k="hook.bar2.label"></span></div>
        </div>
        <div class="more">
          <p data-k="hook.body"></p>
          <p class="note" data-k="hook.caveat"></p>
        </div>
        <button class="more-toggle" type="button"><span data-k="ui.more"></span><span data-k="ui.less"></span></button>
      </div></section>
      <section class="step" data-step="need"><div class="box">
        <h2 data-k="need.headline"></h2>
        <p data-k="need.body"></p>
        <div class="more">
          <p data-k="need.body2"></p>
        </div>
        <button class="more-toggle" type="button"><span data-k="ui.more"></span><span data-k="ui.less"></span></button>
      </div></section>
      <section class="step" data-step="cables"><div class="box">
        <h2 data-k="cables.headline"></h2>
        <p data-k="cables.body"></p>
        <div class="more">
          <ul class="cable-list">
            <li data-k="cables.list.sjc2"></li>
            <li data-k="cables.list.seah2x"></li>
            <li data-k="cables.list.talaylink"></li>
            <li data-k="cables.list.mct"></li>
          </ul>
        </div>
        <button class="more-toggle" type="button"><span data-k="ui.more"></span><span data-k="ui.less"></span></button>
      </div></section>
      <section class="step" data-step="domestic"><div class="box">
        <h2 data-k="domestic.headline"></h2>
        <div class="split" aria-hidden="true">
          <div class="seg sea"><span data-k="domestic.split.sea"></span></div>
          <div class="dot"></div>
          <div class="seg land"><span data-k="domestic.split.land"></span></div>
        </div>
        <p data-k="domestic.gap"></p>
        <div class="more">
          <p data-k="domestic.body"></p>
        </div>
        <button class="more-toggle" type="button"><span data-k="ui.more"></span><span data-k="ui.less"></span></button>
      </div></section>
      <section class="step" data-step="roles"><div class="box">
        <div class="roles">
          <p data-k="domestic.roles"></p>
          <p data-k="domestic.roles2"></p>
          <p data-k="domestic.roles3"></p>
        </div>
        <div class="more">
          <p class="note" data-k="domestic.status"></p>
        </div>
        <button class="more-toggle" type="button"><span data-k="ui.more"></span><span data-k="ui.less"></span></button>
      </div></section>
      <section class="step" data-step="neighbours"><div class="box">
        <h2 data-k="neighbours.headline"></h2>
        <p data-k="neighbours.body"></p>
        <div class="more">
          <p class="note" data-k="neighbours.note"></p>

<script src="lib/d3.min.js"></script>
<script>
// ---- Map ----
// Places as [longitude, latitude]. Approximate; the map is a sketch, not a survey.
const P = {
  bangkok: [100.50, 13.75], chonburi: [100.98, 13.36], sriracha: [100.93, 13.17], rayong: [101.28, 12.68],
  satun: [100.07, 6.62], hatyai: [100.47, 7.01], songkhla: [100.60, 7.20], opendc: [100.42, 6.51],
};
// Map edges for each step: [west-south, east-north]
const VIEW_TH = [[97.2, 5.5], [105.7, 20.5]];        // section 1: all of Thailand
const VIEW_DC = [[99.3, 12.2], [102.4, 14.5]];       // section 2: Bangkok and the EEC data center cluster
const VIEW_SOUTH = [[96.6, 5.3], [104.8, 9.6]];      // section 3: the southern landings, cables arriving from both seas
const VIEW_LEG = [[97.6, 5.6], [104.0, 14.4]];       // sections 4: the domestic leg, Satun to Bangkok
const VIEW_BORDER = [[99.2, 5.8], [101.4, 7.7]];     // section 5: the Thai–Malaysian border

// What the map shows at each step of the story. Layers not listed are hidden; "dim" ones fade back.
const STEPS = {
  hook:       { view: VIEW_TH, show: [] },
  need:       { view: VIEW_DC, show: ['dc'] },
  cables:     { view: VIEW_SOUTH, show: ['dc', 'landing', 'cables'] },
  domestic:   { view: VIEW_LEG, show: ['dc', 'landing', 'cables', 'domestic'], dim: ['cables'] },
  roles:      { view: VIEW_LEG, show: ['dc', 'landing', 'cables', 'domestic'], dim: ['cables'] },
  neighbours: { view: VIEW_BORDER, show: ['dc', 'landing', 'cables', 'domestic', 'opendc'], dim: ['cables', 'domestic'] },
};

// International cables: where they come from is schematic, where they land is the point.
const CABLES = [
  { name: 'SJC2',      pts: [P.songkhla, [102.4, 7.9], [106.6, 8.8]] },
  { name: 'SEA-H2X',   pts: [P.songkhla, [102.6, 7.0], [106.6, 6.6]] },
  { name: 'AAG',       pts: [P.sriracha, [101.6, 11.6], [102.5, 9.9], [104.9, 8.4], [106.6, 9.3]] },
  { name: 'ADC',       pts: [P.sriracha, [101.5, 11.4], [102.3, 9.4], [104.6, 7.7], [106.6, 7.7]] },
  { name: 'MCT',       pts: [P.rayong, [102.3, 11.6], [103.5, 10.6]], anchor: 'start' },
  { name: 'MCT',       pts: [P.rayong, [102.4, 9.0], [103.9, 5.6], [103.4, 3.9]], noLabel: true },
  // TalayLink heads west around the northern tip of Sumatra, then south into the Indian Ocean
  { key: 'map.label.talaylink', pts: [P.satun, [98.6, 6.5], [96.5, 6.4], [94.9, 5.9], [94.2, 4.6], [94.3, 3.0]], planned: true, labelAt: [94.5, 3.9], anchor: 'start' },
  { pts: [P.satun, P.opendc], planned: true, layer: 'opendc' },   // Open DC's planned land link to Malaysia
];
// The domestic leg: southern landings → Rayong (planned subsea link) → EEC → Bangkok
const DOMESTIC = [P.satun, P.hatyai, P.songkhla, [101.0, 8.3], [101.6, 10.4], [101.5, 12.1], P.rayong, P.chonburi, P.bangkok];
const DOMESTIC_SEA_FROM = 2;   // from Songkhla onward the link is planned, not built

// NASA Black Marble 2016 night image, cut to these edges (see images/night-map.jpg)
const NIGHT = { href: 'images/night-map.jpg', west: 92, south: 1, east: 108, north: 22 };
// Country name labels, placed inside each neighbour
const COUNTRIES = [
  ['map.label.myanmar', [96.4, 19.6]], ['map.label.laos', [102.6, 19.4]], ['map.label.cambodia', [104.6, 12.9]],
  ['map.label.vietnam', [106.4, 11.6]], ['map.label.malaysia', [101.9, 4.6]], ['map.label.indonesia', [97.4, 3.6]],
];

// Country outlines: Natural Earth 1:10m, stored locally (lib/region.geojson)
let world = null, thailand = null;
const worldReady = fetch('lib/region.geojson')
  .then(r => r.json())
  .then(g => { world = g.features; thailand = world.find(f => f.properties.name === 'Thailand'); });

// Opening screen shows northern Thailand; scrolling pans south until all of Thailand is in view (section 1)
const VIEW_NORTH = [[97.4, 16.4], [104.6, 20.6]];
STEPS.cover = { view: VIEW_NORTH, show: [] };

let mapStep = 'cover', mapView = VIEW_NORTH, mapPick = k => '', glide = 0;
const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

// The map is drawn once at a fixed base scale (100 px per degree). The "camera" then only shifts and scales it,
// which is cheap enough to follow the reader's scrolling smoothly, even on phones.
const BASE = d3.geoEquirectangular().fitExtent([[0, 0], [1600, 2100]],
  { type: 'MultiPoint', coordinates: [[NIGHT.west, NIGHT.south], [NIGHT.east, NIGHT.north]] });
const curve = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
let pins = [];   // markers and labels that stay the same size on screen while the map scales

function drawMap(pick) {   // full rebuild: on load, window resize and language switch
  if (pick) mapPick = pick;
  if (!world) return;
  pick = mapPick;
  const svg = d3.select('#mapsvg'), flat = d3.select('#pinsvg');
  const { W, H } = screenSize();
  svg.attr('viewBox', `0 0 ${W * TILT.w} ${H * TILT.h}`).selectAll('*').remove();
  flat.attr('viewBox', `0 0 ${W} ${H}`).selectAll('*').remove();
  const geo = d3.geoPath(BASE);

  // Soft left/right edges on the night image, so its cut-off edges don't show
  const defs = svg.append('defs');
  const fade = defs.append('linearGradient').attr('id', 'edge-fade-x');
  [[0, 0], [.06, 1], [.94, 1], [1, 0]].forEach(([o, a]) => fade.append('stop').attr('offset', o).attr('stop-color', '#fff').attr('stop-opacity', a));
  defs.append('mask').attr('id', 'edge-fade').attr('maskContentUnits', 'objectBoundingBox')
    .append('rect').attr('width', 1).attr('height', 1).attr('fill', 'url(#edge-fade-x)');
  const fadeY = defs.append('linearGradient').attr('id', 'edge-fade-y').attr('x2', 0).attr('y2', 1);
  [[0, 0], [.05, 1], [.95, 1], [1, 0]].forEach(([o, a]) => fadeY.append('stop').attr('offset', o).attr('stop-color', '#fff').attr('stop-opacity', a));
  defs.append('mask').attr('id', 'edge-fade-v').attr('maskContentUnits', 'objectBoundingBox')
    .append('rect').attr('width', 1).attr('height', 1).attr('fill', 'url(#edge-fade-y)');

  const cam = svg.append('g').attr('id', 'cam');
  const [nx0, ny0] = BASE([NIGHT.west, NIGHT.north]), [nx1, ny1] = BASE([NIGHT.east, NIGHT.south]);
  cam.append('g').attr('mask', 'url(#edge-fade-v)').append('image').attr('class', 'night').attr('href', NIGHT.href).attr('preserveAspectRatio', 'none').attr('mask', 'url(#edge-fade)')
    .attr('x', nx0).attr('y', ny0).attr('width', nx1 - nx0).attr('height', ny1 - ny0);

  // Spotlight: dim everything except Thailand, then outline the neighbours faintly and Thailand clearly
  cam.append('path').attr('class', 'spotlight').attr('fill-rule', 'evenodd').attr('d', 'M-1e5,-1e5H1e5V1e5H-1e5Z' + geo(thailand));
  cam.append('g').selectAll('path').data(world.filter(f => f !== thailand)).join('path').attr('class', 'border').attr('d', geo);
  // Glowing lines are a wide faint stroke under a thin bright one (cheaper and steadier than blur filters)
  const glowLine = (d, cls, layer) => {
    cam.append('path').attr('class', cls + ' glow').attr('data-layer', layer).attr('d', d);
    cam.append('path').attr('class', cls).attr('data-layer', layer).attr('d', d);
  };
  glowLine(geo(thailand), 'border th');

  const top = flat.append('g').attr('id', 'pins');
  pins = [];
  const label = (p, text, dx, dy, cls = '', anchor = 'start', layer) => {
    const t = top.append('text').attr('class', cls).attr('data-layer', layer).text(text);
    pins.push({ node: t.node(), p, dx, dy, anchor, w: t.node().getComputedTextLength() });
  };
  const mark = (p, shape, cls, layer) => {
    const el = shape === 'rect'
      ? top.append('use').attr('href', '#dc-icon').attr('width', 14).attr('height', 14)
      : top.append('circle').attr('r', 4.5);
    el.attr('class', cls).attr('data-layer', layer);
    pins.push({ node: el.node(), p, shape });
  };

  label([97.4, 8.6], pick('map.label.andaman'), 0, 0, 'sea-name');
  label([101.4, 10.6], pick('map.label.gulf'), 0, 0, 'sea-name');
  COUNTRIES.forEach(([k, p]) => label(p, pick(k), 0, 0, 'country', 'middle'));

  CABLES.forEach(c => {
    const layer = c.layer || 'cables';
    glowLine(curve(c.pts.map(BASE)), 'cable' + (c.planned ? ' planned' : ''), layer);
    const name = c.key ? pick(c.key) : c.name;
    if (name && !c.noLabel) label(c.labelAt || c.pts[c.pts.length - 1], name, 0, -6, 'cable-name', c.anchor || 'end', layer);
  });

  glowLine(curve(DOMESTIC.slice(0, DOMESTIC_SEA_FROM + 1).map(BASE)), 'domestic', 'domestic');
  glowLine(curve(DOMESTIC.slice(DOMESTIC_SEA_FROM).map(BASE)), 'domestic planned', 'domestic');
  label([101.6, 9.6], pick('map.label.opportunity'), 8, 0, 'hl', 'start', 'domestic');

  mark(P.bangkok, 'rect', 'dc', 'dc');
  mark(P.chonburi, 'rect', 'dc', 'dc');
  mark(P.opendc, 'rect', 'dc foreign', 'opendc');
  [P.satun, P.songkhla, P.rayong, P.sriracha].forEach(p => mark(p, 'circle', 'landing', 'landing'));

  label(P.bangkok, pick('map.label.bangkok'), -8, -6, '', 'end', 'dc');
  label(P.chonburi, pick('map.label.eec'), 9, -4, '', 'start', 'dc');
  label(P.sriracha, pick('map.label.sriracha'), -8, 4, '', 'end', 'landing');
  label(P.rayong, pick('map.label.rayong'), 0, 18, '', 'middle', 'landing');
  label(P.satun, pick('map.label.satun'), -8, 4, '', 'end', 'landing');
  label(P.songkhla, pick('map.label.songkhla'), 8, -4, '', 'start', 'landing');
  label(P.opendc, pick('map.label.opendc'), 0, 18, '', 'middle', 'opendc');

  placeCamera();
  applyLayers(false);
}

// Tilt of the map layer: must match #mapsvg in the stylesheet (size, offset, perspective, angle, pivot)
const TILT = { w: 1.5, h: 1.6, left: -.25, top: -.35, d: 1400, deg: 24, ox: .5, oy: .6 };
const screenSize = () => { const r = document.querySelector('.map-box').getBoundingClientRect(); return { W: r.width, H: r.height }; };

// Where a point on the (tilted) map layer appears on screen, and the reverse
function tiltToScreen(x, y, W, H) {
  const a = TILT.deg * Math.PI / 180, ox = TILT.ox * W * TILT.w, oy = TILT.oy * H * TILT.h;
  const dy = y - oy, z = dy * Math.sin(a), k = TILT.d / (TILT.d - z);
  return [TILT.left * W + ox + (x - ox) * k, TILT.top * H + oy + dy * Math.cos(a) * k];
}
function screenToTilt(sx, sy, W, H) {
  const a = TILT.deg * Math.PI / 180, ox = TILT.ox * W * TILT.w, oy = TILT.oy * H * TILT.h;
  const ky = sy - TILT.top * H - oy;
  const dy = ky * TILT.d / (Math.cos(a) * TILT.d + ky * Math.sin(a));
  const z = dy * Math.sin(a);
  return [ox + (sx - TILT.left * W - ox) * (TILT.d - z) / TILT.d, oy + dy];
}

// Point the camera at mapView: fit that box into the free part of the screen
function placeCamera() {
  const cam = d3.select('#cam');
  if (cam.empty()) return;
  const { W, H } = screenSize();
  // Keep the focus clear of the text box: right part of the screen on wide screens, top part on phones
  const [[ax0, ay0], [ax1, ay1]] = W > 800
    ? [[Math.min(620, W * 0.44), 40], [W - 32, H - 40]]
    : [[12, document.querySelector('.legend').offsetHeight + 24], [W - 12, H * 0.45]];   // below the legend
  // The same area on the tilted map layer: the far (top) edge is wider there, so use the near edge's width to stay inside
  const [tlx, tly] = screenToTilt(ax0, ay0, W, H), [blx, bly] = screenToTilt(ax0, ay1, W, H), [brx] = screenToTilt(ax1, ay1, W, H);
  const [x0, y0] = BASE([mapView[0][0], mapView[1][1]]), [x1, y1] = BASE([mapView[1][0], mapView[0][1]]);
  const s = Math.min((brx - blx) / (x1 - x0), (bly - tly) / (y1 - y0));
  const tx = (blx + brx) / 2 - s * (x0 + x1) / 2, ty = (tly + bly) / 2 - s * (y0 + y1) / 2;
  cam.attr('transform', `translate(${tx},${ty}) scale(${s})`);

  for (const q of pins) {
    const [bx, by] = BASE(q.p), [x, y] = tiltToScreen(tx + s * bx, ty + s * by, W, H);
    if (q.shape === 'rect') { q.node.setAttribute('x', x - 7); q.node.setAttribute('y', y - 7); continue; }
    if (q.shape === 'circle') { q.node.setAttribute('cx', x); q.node.setAttribute('cy', y); continue; }
    // Labels: keep them on screen, and clear of the text box on wide screens
    const minX = W > 800 ? ax0 : 6, maxX = W - 6;
    let lx = x + q.dx, ly = y + q.dy, anchor = q.anchor;
    const left = anchor === 'start' ? lx : anchor === 'end' ? lx - q.w : lx - q.w / 2;
    if (left + q.w > maxX) { lx = maxX; anchor = 'end'; ly = y + 16; }
    else if (left < minX) { lx = minX; anchor = 'start'; }
    q.node.setAttribute('x', lx); q.node.setAttribute('y', ly); q.node.setAttribute('text-anchor', anchor);
  }
}

// Fade map layers (and their legend lines) in or out for the current step
function applyLayers(animate) {
  const s = STEPS[mapStep];
  const legend = document.querySelector('.legend');
  legend.style.transition = animate ? 'opacity .6s' : 'none';
  legend.style.opacity = s.show.length ? 1 : 0;   // nothing to explain on the title screen and section 1
  document.querySelectorAll('[data-layer]').forEach(el => {
    const layer = el.dataset.layer;
    let op = s.show.includes(layer) ? 1 : 0;
    if (op && !el.closest('.legend') && s.dim && s.dim.includes(layer)) op = 0.3;
    el.style.transition = animate ? 'opacity .6s' : 'none';
    el.style.opacity = op;
  });
}

// While the reader is still within the opening screen, the scroll position itself drives the camera
const coverHeight = () => document.querySelector('.step.cover').offsetHeight;
let coverDone = false;
function followCoverScroll() {
  const t = Math.min(1, Math.max(0, scrollY / coverHeight()));
  if (t >= 1) {
    if (!coverDone && (mapStep === 'cover' || mapStep === 'hook')) { mapView = VIEW_TH; placeCamera(); }
    coverDone = true;
    return;
  }
  coverDone = false;
  glide++;   // cancel any glide in progress
  mapFade(1);
  const e = d3.easeCubicInOut(t);
  mapView = d3.interpolate(VIEW_NORTH, VIEW_TH)(e);
  placeCamera();
}
let scrollQueued = false;
addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; followCoverScroll(); });
}, { passive: true });

// A camera flight between two views: zoom out, pan, zoom back in, at an even pace.
// Views are boxes in degrees; the flight follows the centre and the overall size, and blends the shape.
function flight(from, to) {
  const box = v => { const w = v[1][0] - v[0][0], h = v[1][1] - v[0][1];
    return { c: [(v[0][0] + v[1][0]) / 2, (v[0][1] + v[1][1]) / 2], size: Math.sqrt(w * h), shape: Math.log(h / w) }; };
  const a = box(from), b = box(to);
  const path = d3.interpolateZoom([...a.c, a.size], [...b.c, b.size]);
  return {
    // Long trips take longer, but stay between 0.8 and 2.2 seconds
    ms: Math.max(800, Math.min(2200, path.duration * 0.9)),
    at: t => {
      const [cx, cy, size] = path(t), r = Math.exp(a.shape + (b.shape - a.shape) * t);
      const w = size / Math.sqrt(r), h = size * Math.sqrt(r);
      return [[cx - w / 2, cy - h / 2], [cx + w / 2, cy + h / 2]];
    },
  };
}

// Move to a story step: fade layers, and fly the map if the view changes
function setMapStep(step) {
  if (!STEPS[step] || step === mapStep) return;
  mapStep = step;
  // Opening screen and section 1: the scroll position steers the camera instead
  if ((step === 'cover' || step === 'hook') && scrollY < coverHeight()) return applyLayers(true);
  const from = mapView, to = STEPS[step].view;
  if (from === to) { glide++; mapFade(1); return applyLayers(true); }
  const run = ++glide, t0 = performance.now();   // a newer step change cancels this glide
  if (REDUCE_MOTION) return fadeTo(to, run, t0);
  applyLayers(true);
  const fly = flight(from, to), ease = d3.easeCubicInOut;
  (function frame(now) {
    if (run !== glide) return;
    const t = Math.min(1, (now - t0) / fly.ms);
    mapView = t < 1 ? fly.at(ease(t)) : to;
    placeCamera();
    if (t < 1) requestAnimationFrame(frame);
  })(t0);
}

// Readers who asked their computer for less motion: no flight, the map fades out and back in at the new view
const mapLayers = () => document.querySelectorAll('#mapsvg, #pinsvg');
function mapFade(o) { mapLayers().forEach(el => el.style.opacity = o); }
function fadeTo(to, run, t0) {
  const OUT = 220, IN = 380;   // milliseconds
  let switched = false;
  (function frame(now) {
    if (run !== glide) return;
    const ms = now - t0;
    if (ms >= OUT && !switched) { switched = true; mapView = to; placeCamera(); applyLayers(false); }
    mapFade(ms < OUT ? 1 - ms / OUT : Math.min(1, (ms - OUT) / IN));
    if (ms < OUT + IN) requestAnimationFrame(frame);
  })(t0);
}

// Reading progress through the map story
const progressLine = document.querySelector('.progress-line'), storyEl = document.querySelector('.story');
const stepEls = [...document.querySelectorAll('.step')];
function updateProgress() {
  const r = storyEl.getBoundingClientRect(), total = r.height - innerHeight;
  const t = Math.min(1, Math.max(0, -r.top / total));
  progressLine.firstElementChild.style.transform = `scaleX(${t})`;
  progressLine.classList.toggle('away', r.bottom < innerHeight * .5);
}
addEventListener('scroll', () => requestAnimationFrame(updateProgress), { passive: true });
updateProgress();

// Phones: "more / less" opens the rest of a box
document.querySelectorAll('.more-toggle').forEach(b => b.addEventListener('click', () => {
  const box = b.closest('.box');
  b.setAttribute('aria-expanded', box.classList.toggle('open'));
}));

// Watch which text step sits in the middle of the screen
const stepWatcher = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('seen');
    setMapStep(e.target.dataset.step);
  });
}, { rootMargin: '-50% 0px -50% 0px' });
stepEls.forEach(el => stepWatcher.observe(el));
</script>
<script>
// Reads the wording from script.md, so A. can edit text without touching this file.
function parseScript(md) {
  const blocks = {};
  let key = null, lang = null;
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.trim();
    const head = line.match(/^##\s+(\S+)/);
    if (head) { key = head[1]; lang = null; blocks[key] = {}; continue; }
    if (!key || line.startsWith('>') || line === '---' || /^#\s/.test(line)) continue;
    const tag = line.match(/^(EN|TH):\s*(.*)$/);
    if (tag) { lang = tag[1]; blocks[key][lang] = tag[2]; continue; }
    if (lang && line) blocks[key][lang] += (blocks[key][lang] ? '\n' : '') + line;
  }
  return blocks;
}

// "~" keeps words together: no space in Thai, a non-breaking space in English
function tidy(text, lang) {
  return text.replace(/~/g, lang === 'TH' ? '⁠' : ' ');
}

let blocks = {};
let lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'EN' : 'TH';

function render() {
  document.documentElement.lang = lang.toLowerCase();
  const pick = k => { const b = blocks[k] || {}; return tidy(b[lang] || b.EN || '', lang); };
  document.querySelectorAll('[data-k]').forEach(el => {
    const text = pick(el.dataset.k);
    if (!el.hasAttribute('data-links')) { el.textContent = text; return; }
    // Text with [name](link) parts: build real links, never raw HTML
    el.replaceChildren();
    let last = 0;
    for (const m of text.matchAll(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g)) {
      el.append(text.slice(last, m.index), Object.assign(document.createElement('a'), { href: m[2], textContent: m[1], target: '_blank', rel: 'noopener' }));
      last = m.index + m[0].length;
    }
    el.append(text.slice(last));
  });
  document.title = pick('cover.title');

  // Sources: lines like "- [Name](link)", built as real links
  const list = document.getElementById('sources');
  list.replaceChildren();
  for (const m of pick('footer.sourcelist').matchAll(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g)) {
    const a = Object.assign(document.createElement('a'), { href: m[2], textContent: m[1], target: '_blank', rel: 'noopener' });
    const li = document.createElement('li'); li.append(a); list.append(li);
  }
  // Short bar's height follows the two numbers in the script (e.g. 350 vs 2,066)
  const num = k => parseFloat(pick(k).replace(/,/g, ''));
  document.getElementById('bar1').style.setProperty('--h', num('hook.bar1.value') / num('hook.bar2.value') || 0);

  document.querySelectorAll('img[data-img]').forEach(img => {
    const file = pick(img.dataset.img).trim();
    img.closest('.photo').classList.toggle('missing', !file);
    if (file && !img.src.endsWith('images/' + file)) img.src = 'images/' + file;
    img.alt = pick(img.dataset.alt);
  });

  drawMap(pick);
}
addEventListener('resize', () => render());

document.querySelector('.lang-switch').addEventListener('click', () => {
  lang = lang === 'TH' ? 'EN' : 'TH';
  const url = new URL(location.href);
  if (lang === 'EN') url.searchParams.set('lang', 'en'); else url.searchParams.delete('lang');
  history.replaceState(null, '', url);
  render();
});

fetch('script.md', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => { blocks = parseScript(md); render(); return worldReady; })
  .then(() => render())
  .catch(() => { document.querySelector('.cover h1').textContent = 'Could not load script.md'; });
</script>
</body>
